apiVersion: apps/v1
kind: Deployment
metadata:
  name: arise-docs
  namespace: arise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arise-docs
  template:
    metadata:
      labels:
        app: arise-docs
    spec:
      containers:
        - name: arise-docs
          image: reimagine.azurecr.io/arise-doc:latest  # <-- your image here
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /platform/appse-ai
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /platform/appse-ai
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30