name: Build & Deploy Docs to AKS (latest)

on:
  push:
    branches:
      - stage26

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, local-k8s]          # CHANGED

    env:
      IMAGE_NAME: appseai-doc
      NAMESPACE: appseai-wfa

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: stage26

      # 2. Login to Azure Container Registry
      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ secrets.ACR_NAME }}.azurecr.io \
            -u ${{ secrets.ACR_NAME }} \
            --password-stdin

      # 3. Build & Push Docker Image
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:top-${{ github.sha }} .   # CHANGED
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:top-${{ github.sha }}         # CHANGED

      # 4. Deploy to local K8s
      - name: Deploy to local K8s
        run: |
          sed "s|__IMAGE__|${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:top-${{ github.sha }}|g" \
            k8s-top/docs-top.yaml | kubectl apply -f -                                              # CHANGED

      # 5. Verify rollout
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/appseai-docs -n $NAMESPACE --timeout=180s
          kubectl get svc appseai-docs -n $NAMESPACE
