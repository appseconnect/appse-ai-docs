name: Build & Deploy Docs to AKS (latest)

on:
  push:
    branches:
      - stage26

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, local-k8s]          # CHANGED: cloud runner can't reach wfa1

    env:
      IMAGE_NAME: appseai-doc
      NAMESPACE: appseai-wfa

    steps:
      # 1. Checkout code updated
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: stage26

      # 2. Login to Azure: REMOVED (only needed for AKS)

      # 3. Login to Azure Container Registry
      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ secrets.ACR_NAME }}.azurecr.io \
            -u ${{ secrets.ACR_NAME }} \
            --password-stdin

      # 4. Build & Push Docker Image
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:top-${{ github.sha }} .   # CHANGED: not :latest (prod's tag)
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:top-${{ github.sha }}         # CHANGED

      # 5. Get AKS credentials: REMOVED (would point kubectl at PROD AKS)

      # 6. Deploy to local K8s
      - name: Deploy to AKS
        run: |
          sed "s|__IMAGE__|${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:top-${{ github.sha }}|g" \
            k8s-top/docs-top.yaml | kubectl apply -f -                                              # CHANGED: local manifests, not prod's

      # 7. Restart deployment to force image pull
      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/appseai-docs -n $NAMESPACE

      # 8. Verify rollout
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/appseai-docs -n $NAMESPACE
          kubectl get svc appseai-docs -n $NAMESPACE
