name: Build & Deploy Docs to AKS (latest)

on:
  push:
    branches:
      - insync-top                                  # CHANGED

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: appseai-doc
      NAMESPACE: appseai-wfa

    steps:
      # 1. Checkout code updated
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: insync-top                           # CHANGED

      # 2. Login to Azure using AZURE_CREDENTIALS (Service Principal)
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Login to Azure Container Registry
      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ secrets.ACR_NAME }}.azurecr.io \
            -u ${{ secrets.ACR_NAME }} \
            --password-stdin

      # 4. Build & Push Docker Image (top)          # CHANGED: never :latest (prod's tag)
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:top-${{ github.sha }} \
                       -t ${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:top-latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:top-${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:top-latest

      # 5–8 REMOVED: AKS credentials / deploy / restart / verify
      # (would deploy to PROD AKS; the Azure DevOps release deploys to local instead)
